name: Release desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
            command: pnpm --filter @auto-crop/desktop exec electron-builder --mac dmg zip --arm64 --x64 --publish never
            files: apps/desktop/release/*.{dmg,zip,blockmap}
          - os: windows-latest
            artifact: windows
            command: pnpm --filter @auto-crop/desktop exec electron-builder --win nsis --x64 --publish never
            files: apps/desktop/release/*.{exe,blockmap}
          - os: ubuntu-latest
            artifact: linux
            command: pnpm --filter @auto-crop/desktop exec electron-builder --linux AppImage --x64 --publish never
            files: apps/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: auto-crop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
